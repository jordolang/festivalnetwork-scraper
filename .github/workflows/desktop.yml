name: Desktop builds

# Four artifacts, one per platform/architecture pair.  Windows cannot
# cross-build, so the ARM64 Windows app is built on an ARM64 runner and
# the Intel Mac app on an Intel runner; each frozen app embeds the
# CPython and extension modules of the machine that built it.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Publish a release at this tag, e.g. v1.0.0. Leave empty to just
          build. The tag is created at the commit this run is dispatched
          from, so it does not have to exist yet.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run the suite
        # xvfb-run gives the window tests a display; the rest do not care.
        run: xvfb-run -a python -m pytest -q

  build:
    name: ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.runner }}
    # A repository without ARM64 Windows runners still gets the other
    # three artifacts instead of a red build.
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        # No macos-13 entry.  GitHub is winding that image down and the job
        # never acquires a runner — and a queued job never *concludes*, so
        # continue-on-error cannot rescue it and `needs: build` waits
        # forever.  An unobtainable runner has to be out of the dependency
        # graph entirely, not merely marked optional.  Intel Macs are served
        # by the universal2 job below instead.
        include:
          - label: Windows x64
            runner: windows-latest
            arch: x64
            optional: false
          - label: Windows ARM64
            runner: windows-11-arm
            arch: arm64
            optional: true
          - label: macOS Apple Silicon
            runner: macos-14
            arch: arm64
            optional: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Check Tk is present
        run: python -c "import tkinter, sys; print('Tk', tkinter.TkVersion, sys.platform)"

      - name: Build the app
        run: python packaging/build.py

      - name: Verify the frozen app starts
        # The app that just got built, not the source tree it was built
        # from: a missing hidden import or an icon left out of the bundle
        # only shows up in the frozen copy, and importing the checkout
        # would sail past both.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # The .app, before it is sealed into the .dmg.
            "dist/FestivalNet Scraper.app/Contents/MacOS/FestivalNet Scraper" --check
          else
            # The one-file .exe is the deliverable itself.
            "$(ls dist/*.exe | head -1)" --check
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: festivalnet-scraper-${{ matrix.arch }}-${{ runner.os }}
          # .exe on Windows, .dmg on macOS — whichever this runner made.
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  universal-mac:
    name: macOS universal (Intel + Apple silicon)
    needs: test
    runs-on: macos-14
    # Optional, and genuinely so: this runner concludes either way, so a
    # failure here cannot stall the release the way a queued job would.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install a universal2 CPython
        # actions/setup-python serves a single-architecture build, and
        # PyInstaller can only emit a universal2 app from a universal2
        # interpreter.  The python.org installer is the one that ships both
        # slices, Tk included.
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/python.pkg \
            https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg /tmp/python.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.12/bin" \
            >> "$GITHUB_PATH"

      - name: Confirm it really is universal2
        run: |
          set -euo pipefail
          python3 -c "import sys, tkinter; print(sys.executable, tkinter.TkVersion)"
          # Refuse to continue on a single-slice interpreter: the build would
          # succeed and quietly produce an arm64-only app called universal.
          lipo -archs "$(python3 -c 'import sys; print(sys.executable)')" | tee /tmp/archs
          grep -q x86_64 /tmp/archs
          grep -q arm64 /tmp/archs

      - name: Build the universal app
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-build.txt
          python3 packaging/build.py --target universal2

      - name: Verify the frozen app starts
        run: '"dist/FestivalNet Scraper.app/Contents/MacOS/FestivalNet Scraper" --check'

      - name: Confirm the app carries both slices
        run: |
          set -euo pipefail
          lipo -archs "dist/FestivalNet Scraper.app/Contents/MacOS/FestivalNet Scraper"

      - uses: actions/upload-artifact@v4
        with:
          name: festivalnet-scraper-universal2-macOS
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    # Deliberately not waiting on universal-mac: it is a bonus artifact, and
    # nothing optional belongs on the critical path to a release.
    needs: build
    # Two ways in: push a v* tag, or dispatch this workflow with a
    # release_tag.  The second exists because creating a tag is not always
    # something the person cutting the release can do from a shell — a
    # scoped credential may allow branch pushes and refuse tag refs — while
    # GITHUB_TOKEN in here always can.
    #
    # The event_name guard is not redundant.  Without it the second arm
    # reads `inputs.release_tag != ''` on pull_request runs too, where
    # `inputs` is null, and the whole job hangs on how GitHub coerces null
    # against a string.  Get that wrong and every PR publishes a release
    # named after its merge ref.  Naming the event costs nothing and does
    # not depend on knowing the coercion rule.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Check which targets actually built
        shell: bash
        run: |
          ls -la artifacts
          absent() { ! ls artifacts/*"$1" >/dev/null 2>&1; }

          # Required: their runners are always obtainable, so a gap here is
          # a real build failure and must stop the release.
          fatal=""
          for target in windows-x64.exe macos-arm64.dmg; do
            if absent "$target"; then
              echo "MISSING (required): $target"
              fatal="$fatal $target"
            else
              echo "present: $target"
            fi
          done

          # Optional: nice to have, but their absence is a runner or
          # toolchain fact, not a reason to withhold every other download.
          missing=""
          for target in windows-arm64.exe macos-universal2.dmg; do
            if absent "$target"; then
              echo "missing (optional): $target"
              missing="$missing $target"
            else
              echo "present: $target"
            fi
          done

          if [ -n "$fatal" ]; then
            echo "::error::Refusing to publish without:$fatal"
            exit 1
          fi
          if [ -n "$missing" ]; then
            echo "::warning::Publishing without:$missing"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.dmg
          # Published, not drafted: a draft release is invisible on the
          # Releases page, so the downloads would not actually reach anyone.
          draft: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          # Creates the tag at this run's commit if it does not exist yet.
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: FestivalNet Scraper ${{ inputs.release_tag || github.ref_name }}
          body: |
            Desktop builds of the FestivalNet Scraper. Download the one that
            matches your machine, unzip it, and run **FestivalNet Scraper**.

            | You have | Download | Then |
            |----------|----------|------|
            | A Windows PC | `...-windows-x64.exe` | Double-click it |
            | A Windows-on-ARM PC | `...-windows-arm64.exe` | Double-click it |
            | A Mac with Apple silicon (M1-M4) | `...-macos-arm64.dmg` | Open it, drag the app to Applications |
            | An Intel Mac (2020 or earlier) | `...-macos-universal2.dmg` | Open it, drag the app to Applications |

            The `universal2` build runs on *any* Mac, Intel or Apple
            silicon, so take that one if you are unsure.

            Not sure which Mac: **Apple menu -> About This Mac**. On Windows:
            **Settings -> System -> About -> System type**.

            These builds are unsigned, so the first launch needs
            **More info -> Run anyway** on Windows, or **right-click -> Open**
            on macOS. Afterwards they open normally.
